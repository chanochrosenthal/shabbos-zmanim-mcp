[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shabbos-zmanim-mcp"
version = "0.1.0"
description = "Shabbos & Zmanim: a self-hosted MCP server (Streamable HTTP) with candle lighting, havdalah, zmanim, parsha, holidays, daf yomi and Hebrew dates for Alexa+ and any MCP client. Data: Hebcal.com (CC BY 4.0)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
shabbos-zmanim-mcp = "zmanim_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zmanim_mcp = ["data/*.json"]
